[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "boundary-aware-latent-pruning"
version = "1.0.0"
description = "VQ-VAE, K-means, and local OC-SVM dataset pruning for imbalanced medical images"
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "Project contributors"}]
keywords = ["dataset pruning", "medical imaging", "VQ-VAE", "class imbalance", "one-class SVM"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "numpy>=1.26",
  "pandas>=2.0",
  "Pillow>=10.0",
  "PyYAML>=6.0",
  "scikit-learn>=1.3",
]

[project.optional-dependencies]
experiment = [
  "torch>=2.2",
  "torchvision>=0.17",
  "timm>=0.9.16",
  "tqdm>=4.66",
]
analysis = [
  "matplotlib>=3.8",
  "seaborn>=0.13",
]
ablation = [
  "imbalanced-learn>=0.12",
]
all = [
  "torch>=2.2",
  "torchvision>=0.17",
  "timm>=0.9.16",
  "tqdm>=4.66",
  "matplotlib>=3.8",
  "seaborn>=0.13",
  "imbalanced-learn>=0.12",
]
dev = [
  "ruff>=0.6",
]

[project.scripts]
latent-pruning = "latent_pruning.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
